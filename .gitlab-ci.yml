image: python:3.15

stages:
  - test
  - secret-detection

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

variables:
  SECRET_DETECTION_ENABLED: 'true'

unit-tests:
  stage: test
  script:
    - python -m pip install -e ".[test]"
    - python -m pytest

sast:
  stage: test

secret_detection:
  stage: secret-detection
