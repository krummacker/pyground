[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyground"
version = "0.1.0"
description = "Hello World program"
requires-python = ">=3.9"

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
pyground = "pyground.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/pyground"]
pythonpath = ["src"]
